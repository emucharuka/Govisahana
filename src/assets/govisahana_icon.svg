<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Center leaf gradient: yellow-green core to dark green edges -->
    <radialGradient id="centerLeaf" cx="50%" cy="60%" r="55%" fx="50%" fy="55%">
      <stop offset="0%"   stop-color="#d4f000"/>
      <stop offset="30%"  stop-color="#7ec800"/>
      <stop offset="65%"  stop-color="#3a9a00"/>
      <stop offset="100%" stop-color="#1a6600"/>
    </radialGradient>
    <!-- Side leaf gradient -->
    <radialGradient id="sideLeaf" cx="50%" cy="55%" r="55%" fx="45%" fy="50%">
      <stop offset="0%"   stop-color="#c8e800"/>
      <stop offset="35%"  stop-color="#6ab800"/>
      <stop offset="75%"  stop-color="#2e8c00"/>
      <stop offset="100%" stop-color="#1a6000"/>
    </radialGradient>
    <!-- Dark green ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#145214"/>
      <stop offset="50%"  stop-color="#1e7a1e"/>
      <stop offset="100%" stop-color="#0f3d0f"/>
    </linearGradient>
  </defs>

  <!-- Outer dark green thick ring -->
  <circle cx="100" cy="100" r="94" fill="url(#ringGrad)"/>
  <!-- White interior circle -->
  <circle cx="100" cy="100" r="80" fill="white"/>

  <!-- Left side leaf -->
  <path d="M100 130
           C90 120 62 108 52 80
           C48 68 54 55 62 52
           C70 49 80 56 85 68
           C90 80 88 105 100 130Z"
        fill="url(#sideLeaf)"/>
  <!-- Left leaf white vein -->
  <path d="M75 57 C74 72 78 90 100 130" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Right side leaf -->
  <path d="M100 130
           C110 120 138 108 148 80
           C152 68 146 55 138 52
           C130 49 120 56 115 68
           C110 80 112 105 100 130Z"
        fill="url(#sideLeaf)"/>
  <!-- Right leaf white vein -->
  <path d="M125 57 C126 72 122 90 100 130" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Center tall leaf (front, largest) -->
  <path d="M100 28
           C110 45 126 68 126 95
           C126 118 114 135 100 140
           C86 135 74 118 74 95
           C74 68 90 45 100 28Z"
        fill="url(#centerLeaf)"/>
  <!-- Center leaf stem -->
  <path d="M100 140 C100 155 100 162 100 168" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Center leaf vein -->
  <path d="M100 48 C100 80 100 110 100 140" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Center leaf vein curve left -->
  <path d="M100 95 C90 88 80 82 74 78" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Center leaf vein curve right -->
  <path d="M100 95 C110 88 120 82 126 78" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
